name: Feature Request
description: Request for a feature to be added.
title: "[Feature]: "
labels: ["feature", "triage"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Your feature may be added in the not-so-faraway future!
  - type: textarea
    id: feature-request
    attributes:
      label: What should be added?
      description: Also tell us, what did you expect to happen?
      placeholder: Add a...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this feature?
      description: Who does it help? Why should we add it?
      placeholder: It makes it more convenient to...
    validations:
      required: true
